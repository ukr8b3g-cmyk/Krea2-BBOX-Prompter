name: Registry publication configuration checks
on:
  push:
    branches: [main]
    paths: ['.github/**', '.comfyignore']
  pull_request:
    paths: ['.github/**', '.comfyignore']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run offline publication mock tests
        run: python -B -m unittest discover -s .github -p test_registry_release.py -v
