name: Create a stable GitHub Release

# Configuration pushes must never create or republish an old release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing stable Git tag to release, e.g. v1.2.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'ukr8b3g-cmyk/Krea2-BBOX-Prompter' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.source.outputs.tag }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out release tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          path: control
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify existing tag and package version
        id: source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -B control/.github/registry_release.py release-source --policy control/.github/registry-policy.json --tag "$RELEASE_TAG"
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
          persist-credentials: false
      - name: Python regression tests
        working-directory: source
        run: python -B -m unittest discover -s tests -v
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: JavaScript syntax and regression tests
        working-directory: source
        run: |
          node --check web/krea2_element_framing_v1.js
          node --test tests/test_frontend_cloneable_state.mjs
      - name: Create the stable Release for the existing validated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" --generate-notes --latest

  registry:
    needs: release
    permissions:
      contents: read
    # GITHUB_TOKEN-created releases do not trigger a separate release workflow.
    # Call the same guarded publisher directly after successful Release creation.
    uses: ./.github/workflows/publish_registry.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
    secrets:
      REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
